name: heartbeat_monitor
module: HeartbeatMonitor

time_between_checks_s: 60
warning_threshold_s: 120

# AlertConsumer Inits
alert_keys:
  - "heartbeat.#"
alert_key_parser_re: 'heartbeat\.(?P<service_name>\w+)'

endpoints:
  - name: heartbeat_monitor
    module: HeartbeatTracker
  - name: my_store
    module: HeartbeatTracker
