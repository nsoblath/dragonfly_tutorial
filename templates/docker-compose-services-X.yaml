services:

  unusual:
    image: ghcr.io/project8/dragonfly:workshop
    depends_on:
      - rabbit-broker
      - <device service>
    volumes:
      - ./services/<service config>.yaml:/root/unusual-device.yaml
      - ./infrastructure/dripline_mesh.yaml:/root/.dripline_mesh.yaml
    environment:
      - DRIPLINE_USER=dripline
      - DRIPLINE_PASSWORD=dripline
    command:
      bash -c "dl-serve -vv -c /root/unusual-device.yaml"
    networks:
      - mesh

networks:
  mesh:
    external: TRUE
