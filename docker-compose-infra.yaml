services:

  # The broker for the mesh
  rabbit-broker:
    image: rabbitmq:4-management
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=dripline
      - RABBITMQ_DEFAULT_PASS=dripline
    networks:
      - mesh

  http-server:
    image: ghcr.io/project8/dragonfly:develop-dev
    depends_on:
      - rabbit-broker
    ports:
      - "8080:8080"
    volumes:
      - ./dripline_mesh.yaml:/root/.dripline_mesh.yaml
    environment:
      - DRIPLINE_USER=dripline
      - DRIPLINE_PASSWORD=dripline
    command: >
      bash -c "dl-http-server web_root=/usr/local/src_py/html"
    networks:
      - mesh

  postgres:
    image: postgres:16.0
    volumes:
      - ./postgres_init.d:/docker-entrypoint-initdb.d
    environment:
      # per the docs, you do *not* want to run with this configuration in production
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    networks:
      - mesh

  scpi-device:
    image: python:3.12.1-slim-bookworm
    volumes:
      - ./scpi_device/scpi_device.py:/root/scpi_device.py
    command: 
      - /root/scpi_device.py
      - 0.0.0.0
    ports:
      - "24596:24596"
    environment:
      PYTHONUNBUFFERED: 1  # don't buffer printing to stdout
    networks:
      - mesh

  slowdash:
    image: ghcr.io/slowproj/slowdash:latest
    depends_on:
      - postgres
    volumes:
      - ./slowdash:/project
    ports:
      - "18881:18881"
    networks:
      - mesh

networks:
  mesh:
    external: TRUE

